  --cream:#FAF5F1;--gray:#706F6E;--mid:#B8B3B3;--line:#E4DFDB;--purple:#936EFF;--purple-t:#EFE6FF;--red:#DA4750;--teal-t:#E0F8F5;--yellow:#FCEE49;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;}
body{font-family:"Host Grotesk",system-ui,sans-serif;color:var(--dark);background:#fff;overflow:hidden;}
.mono{font-family:"DM Mono",ui-monospace,monospace}
header{height:64px;display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid var(--line);}
header .mark{width:30px;height:30px}
header h1{font-size:18px;font-weight:600;letter-spacing:.2px}
header .eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:2px;color:var(--ink-teal);text-transform:uppercase}
.dots{margin-left:auto;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .3s}
.dot.done{background:var(--teal-shade)}
.dot.cur{background:var(--teal);transform:scale(1.4)}
.count{font-family:"DM Mono",monospace;font-size:12px;color:var(--gray);margin-left:12px;min-width:54px;text-align:right}
main{display:grid;grid-template-columns:minmax(420px,44%) 1fr;height:calc(100% - 64px - 92px);}
#diagramWrap{padding:18px 10px 10px 24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff, var(--cream));border-right:1px solid var(--line);}
svg#diagram{width:100%;height:100%;max-height:100%;}
.node rect{fill:#fff;stroke:var(--line);stroke-width:1.5;transition:all .35s}
.node text{fill:var(--dark);font-size:13px;font-weight:600;transition:fill .35s}
.node text.sub{font-size:10px;font-weight:400;fill:var(--gray);font-family:"DM Mono",monospace}
.node.active rect{fill:var(--teal);stroke:var(--teal-shade);filter:drop-shadow(0 0 10px rgba(0,210,192,.55))}
.node.active text.sub{fill:var(--dark)}
.node.alert rect{fill:#FDECEC;stroke:var(--red);filter:drop-shadow(0 0 10px rgba(218,71,80,.45))}
.node.purple.active rect{fill:var(--purple-t);stroke:var(--purple);filter:drop-shadow(0 0 10px rgba(147,110,255,.5))}
.chip rect{fill:var(--cream);stroke:var(--line);transition:all .35s}
.chip text{font-size:11px;font-weight:600;fill:var(--dark)}
.chip.on rect{fill:var(--teal);stroke:var(--teal-shade)}
.edge{fill:none;stroke:#CFC9C4;stroke-width:1.6;transition:stroke .3s}
.edge.on{stroke:var(--teal-shade);stroke-width:2.2}
.edge.dash{stroke-dasharray:4 4}
.packet{fill:var(--teal-shade)}
.packet.red{fill:var(--red)}
.groupbox{fill:none;stroke:var(--teal-shade);stroke-dasharray:5 5;stroke-width:1.2;opacity:.6}
.grouplabel{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:1.5px;fill:var(--ink-teal)}
#panel{padding:26px 34px 10px 34px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.kicker{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:2px;color:var(--ink-teal);text-transform:uppercase}
#title{font-size:34px;font-weight:700;line-height:1.08;letter-spacing:-.3px}
#narr{font-size:17px;line-height:1.45;color:#2a4a4c;max-width:820px}
#narr b{color:var(--dark)}
#stage{flex:1;min-height:0}
.card{background:var(--cream);border-radius:12px;padding:16px 18px;}
.card h4{font-size:12px;font-family:"DM Mono",monospace;letter-spacing:1.5px;color:var(--ink-teal);text-transform:uppercase;font-weight:400;margin-bottom:10px}
.row{display:flex;gap:14px}
.row>*{flex:1}
pre.code{background:var(--dark2);color:#E8F4F2;border-radius:12px;padding:16px 18px;font-family:"DM Mono",monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow:auto}
.k{color:var(--cyan)} .s{color:#B8F5D9} .n{color:#FFD58A} .c{color:#7FA8A6}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:12px 16px;border-radius:14px;font-size:16px;line-height:1.4;animation:pop .35s ease}
.bubble.user{align-self:flex-start;background:var(--cream);border-bottom-left-radius:4px}
.bubble.agent{align-self:flex-end;background:var(--teal);border-bottom-right-radius:4px}
.who{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--gray);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:pop .4s ease both}
table.dec{width:100%;border-collapse:collapse;font-size:15px}
table.dec td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dec td:first-child{font-family:"DM Mono",monospace;font-size:13px;color:var(--gray);width:34%}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;width:140px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--teal-shade);width:0;transition:width .9s ease}
.bar.red i{background:var(--red)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600;background:var(--teal-t);color:var(--ink-teal)}
.pill.red{background:#FDECEC;color:var(--red)}
.pill.purple{background:var(--purple-t);color:#5B3FC4}
.stack{display:flex;height:56px;border-radius:10px;overflow:hidden;background:var(--cream);border:1px solid var(--line)}
.seg{width:0;transition:width .7s ease;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;color:var(--dark)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;opacity:0;transform:translateY(6px);transition:all .4s}
.li.show{opacity:1;transform:none}
.sw{width:14px;height:14px;border-radius:3px;flex:none;margin-top:2px}
.tok{font-family:"DM Mono",monospace;font-size:28px;color:var(--dark)}
.think{background:#fff;border:1px dashed var(--purple);border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.5;color:#3d2d7a;min-height:140px;white-space:pre-wrap}
.cursor{display:inline-block;width:8px;height:18px;background:var(--purple);vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.approve{border:2px solid var(--purple);background:#fff;border-radius:14px;padding:20px 22px}
.approve h3{font-size:20px;margin-bottom:6px}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:10px;padding:10px 18px;cursor:pointer}
.btn.ok{background:var(--teal);color:var(--dark)}
.btn.no{background:var(--cream);color:var(--gray)}
.states{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state{padding:8px 12px;border-radius:8px;background:var(--cream);font-family:"DM Mono",monospace;font-size:13px;color:var(--gray);transition:all .3s}
.state.on{background:var(--teal);color:var(--dark)}
.arrowR{color:var(--mid)}
.wf{display:grid;grid-template-columns:200px 1fr 92px;gap:6px 12px;align-items:center;font-size:13px}
.wf .lab{font-family:"DM Mono",monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf .lab.l1{padding-left:14px}
.wf .track{position:relative;height:18px}
.wf .span{position:absolute;height:100%;border-radius:3px;width:0;transition:width .6s ease}
.wf .meta{font-family:"DM Mono",monospace;font-size:11px;color:var(--gray);text-align:right}
.score{display:grid;grid-template-columns:1fr auto auto;gap:10px 16px;align-items:center;font-size:15px}
.score .g{font-family:"DM Mono",monospace;font-size:12px;color:var(--gray)}
.big{font-size:44px;font-weight:700;color:var(--teal-shade);line-height:1}
.email{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15px;line-height:1.5}
.hidden-ins{background:#FDECEC;color:var(--red);border-radius:4px;padding:1px 4px;font-family:"DM Mono",monospace;font-size:13px}
.ghost{color:#fff;user-select:all}
.intro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.intro-grid .card b{display:block;font-size:16px;margin-bottom:4px}
.intro-grid .card{font-size:14px;line-height:1.4}
footer{height:92px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;background:#fff}
#prev{font-family:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--gray);cursor:pointer}
#next{margin-left:auto;font-family:inherit;background:var(--dark);color:#fff;border:none;border-radius:12px;padding:16px 22px;font-size:17px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .2s}
#next:hover{background:var(--teal-shade)}
#next .lbl{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}
#next .t{font-weight:600}
#next .arr{font-size:20px;color:var(--teal)}
.hint{font-family:"DM Mono",monospace;font-size:11px;color:var(--mid)}
#notes{position:fixed;right:20px;bottom:104px;width:420px;background:var(--dark);color:#E8F4F2;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.45;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#notes h5{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:1.5px;color:var(--cyan);margin-bottom:6px;font-weight:400}
#notes.show{display:block}
/* revealed complexity */
.node{transition:opacity .5s}
.edge{transition:stroke .3s,opacity .5s}
.groupbox,.grouplabel,.edgelab,.iolab{transition:opacity .5s}
.off{opacity:0 !important;pointer-events:none}
.boot *{transition:none !important}
.edge.io{stroke:var(--teal-shade);stroke-width:2.2}
.edgelab{font-family:"DM Mono",monospace;font-size:9.5px;fill:var(--ink-teal)}
.iolab{font-family:"DM Mono",monospace;font-size:11px;fill:var(--ink-teal)}
/* tokens */
.tks{display:flex;flex-wrap:wrap;gap:4px;min-height:32px}
.tk{font-family:"DM Mono",monospace;font-size:14px;padding:4px 7px;border-radius:6px;background:var(--teal-t);color:var(--dark);white-space:pre;animation:pop .25s ease}
.tk i{font-style:normal;color:var(--mid)}
.tk.out{background:var(--purple-t);color:#3d2d7a}
.tnote{font-size:13px;color:var(--gray);margin-top:8px}
.flowcap{font-family:"DM Mono",monospace;font-size:12px;color:var(--gray);text-align:center;margin:10px 0;transition:opacity .4s}
.blk{opacity:0;transform:translateY(6px);transition:all .4s}
.blk.show{opacity:1;transform:none}
.blk p{font-size:14px;line-height:1.4;margin:8px 0 10px}
.blk pre.code{font-size:12px;padding:12px 14px}
/* visual hierarchy: active > near (connected by a live edge) > far */
.node.near rect{stroke:#A9BDBB}
.node.far{opacity:.3}
#n-model.far{opacity:.6}
#n-model rect{stroke:#C9B8FF}
.node.risk rect{stroke:var(--red);fill:#fff}
.node text{transition:fill .35s,opacity .35s,transform .35s}
.node:not(.active):not(.alert):not(#n-model) text.sub{opacity:0}
.node:not(.active):not(.alert):not(#n-model):not(#n-ctx) text:not(.sub){transform:translateY(7px)}
#n-ctx:not(.active) .chip.on rect{fill:var(--teal-t);stroke:#A9BDBB}
.edge{stroke:#E1DBD6;stroke-width:1.3}
.groupbox{opacity:.45}
/* token and cost meter */
.meter{display:flex;gap:6px;transition:opacity .5s}
.meter .m{background:var(--cream);border-radius:8px;padding:6px 12px;min-width:86px;transition:background .3s}
.meter .ml{display:flex;align-items:center;gap:6px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;color:var(--gray);text-transform:uppercase}
.meter .ml i{width:8px;height:8px;border-radius:2px;display:inline-block}
.meter .mv{font-family:"DM Mono",monospace;font-size:17px;color:var(--dark)}
.meter .m.cost{background:var(--dark)} .meter .m.cost .ml{color:#9FC9C5} .meter .m.cost .mv{color:var(--cyan)}
.meter .m.bump{background:var(--teal-t)} .meter .m.cost.bump{background:var(--teal-shade)}
table.bill{font-size:13px} table.bill td{padding:6px 8px}
table.bill th{font-family:"DM Mono",monospace;font-size:11px;font-weight:400;color:var(--gray);text-align:right;padding:4px 8px}
table.bill td:not(:first-child){text-align:right;font-family:"DM Mono",monospace;font-size:13px}
table.bill tr.tot td{font-weight:600;border-bottom:none}
/* meter caption */
.meter{flex-direction:column;gap:4px}
.meter .mrow{display:flex;gap:6px}
.meter .mcap{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;color:var(--ink-teal);text-transform:uppercase}
/* code line highlight */
pre.code .ln{display:block;margin:0 -10px;padding:0 10px;border-radius:4px;transition:background .25s,box-shadow .25s}
pre.code .ln.hl{background:rgba(69,245,230,.16);box-shadow:inset 3px 0 0 var(--cyan)}
.passlbl{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink-teal);margin-bottom:8px;min-height:16px}
/* hooks */
.hooktag{display:inline-block;margin-left:10px;padding:2px 8px;border-radius:12px;background:var(--purple-t);color:#5B3FC4;font-size:11px;letter-spacing:.5px;text-transform:none;vertical-align:1px}
.hk{display:grid;grid-template-columns:104px 140px 1fr 128px 118px;gap:0 12px;align-items:center;font-size:14px}
.hk .r.show.mute{opacity:.35}
.hk .sf .pill{transition:all .3s}
.hk .sf.lit .pill{background:var(--teal);color:var(--dark)}
.hk>div{padding:3px 0;border-bottom:1px solid var(--line);line-height:1.3}
.hk .hd{font-family:"DM Mono",monospace;font-size:11px;color:var(--gray);padding-top:0}
.hk .cad{font-family:"DM Mono",monospace;font-size:11px;color:var(--gray)}
.hk .ev{font-family:"DM Mono",monospace;font-size:13px;font-weight:400}
.hk .ev span{background:var(--cream);border-radius:6px;padding:3px 8px;transition:all .3s}
.hk .row-on .ev span, .hk .ev span.on{background:var(--purple);color:#fff}
.hk .ctl{font-size:13px;color:var(--gray)}
.hk .r{opacity:.35;transition:opacity .4s}
.hk .r.show{opacity:1}
@media (max-width:1000px){
  .hk{grid-template-columns:96px 1fr 110px;font-size:13px} .hk .cad,.hk .ctl,.hk .hd.x{display:none}
  .meter .m{min-width:0;padding:5px 8px} .meter .m.calls{display:none}
  main{grid-template-columns:1fr;grid-template-rows:42% 58%}
  #diagramWrap{border-right:none;border-bottom:1px solid var(--line);padding:10px}
  #panel{padding:18px 20px}
  #title{font-size:26px} #narr{font-size:15px}
  .intro-grid{grid-template-columns:1fr 1fr}
  .row{flex-direction:column}
  .hint,.dots{display:none}
  header h1{font-size:15px}
  #next{padding:12px 16px;font-size:15px}
  .wf{grid-template-columns:150px 1fr 60px}
}
/* context slides: own visual on the left instead of the architecture diagram */
#introViz{display:none;width:100%;height:100%;min-height:0;align-items:center;justify-content:center}
#diagramWrap{position:relative;min-height:0;overflow:hidden}
#panel{min-height:0}
footer{position:relative;z-index:5}
#prev{white-space:nowrap;flex:none}
body.intro svg#diagram{position:absolute;visibility:hidden}
body.intro #introViz{display:flex}
.ladder{width:100%;height:100%;max-width:580px;max-height:520px;display:flex;flex-direction:column;padding:10px 14px 4px 4px}
.lrow{flex:1;display:flex;align-items:flex-end;gap:14px;min-height:0}
.rung{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.rung.show{opacity:1;transform:none}
.rung b{font-size:17px}
.rung p{font-size:13px;line-height:1.35;color:#2a4a4c}
.rk{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-teal)}
.rw{margin-top:auto;font-weight:600;font-size:14px}
.rwl{display:block;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);font-weight:400;margin-bottom:2px}
.rung.agent{background:var(--teal);border-color:var(--teal-shade);box-shadow:0 0 18px rgba(0,210,192,.4)}
.rung.agent .rk,.rung.agent .rwl{color:var(--dark)}
.laxis{margin-top:16px;border-top:2px solid var(--teal-shade);position:relative;padding-top:8px;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-teal);text-align:right;opacity:0;transition:opacity .6s}
.laxis.show{opacity:1}
.laxis:after{content:"";position:absolute;right:-10px;top:-7px;border:6px solid transparent;border-left:10px solid var(--teal-shade);border-right:0}
.shift{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.shift .card{font-size:14px;line-height:1.4}
.shift .card b{display:block;font-size:16px;margin-bottom:4px}
.punch{background:var(--dark);color:#E8F4F2;border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.45;margin-top:12px}
.punch b{color:var(--cyan)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{background:var(--cream);border-radius:8px;padding:7px 12px;font-size:14px}
.facts b{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-teal);font-weight:400;margin-right:6px}
.facts span:last-child{background:var(--purple-t)}
.legend2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.lg{display:flex;gap:10px;align-items:flex-start;padding:3px 8px;border-radius:8px;font-size:13.5px;line-height:1.3;opacity:0;transition:opacity .4s,background .2s;cursor:default}
.lg.show{opacity:1}
.lg:hover{background:var(--teal-t)}
.lg b{display:block;font-size:14.5px}
.lg span:not(.lgn){color:#2a4a4c}
.lgn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--dark);color:#fff;font-family:"DM Mono",monospace;font-size:10px;display:flex;align-items:center;justify-content:center;margin-top:1px}
@media (max-height:900px){ body.uc #title{font-size:28px} body.uc #narr{font-size:15px;line-height:1.4} body.uc .lg{font-size:12.5px;padding:2px 8px} body.uc .lg b{font-size:13.5px} body.uc .legend2{row-gap:0} }
.groupbox.hl{stroke:var(--teal);stroke-width:2;opacity:1}
.badge circle{fill:var(--dark)}
.badge text{fill:#fff;font-family:"DM Mono",monospace;font-size:10px}
@media (max-width:1000px){
  .legend2{grid-template-columns:1fr;grid-auto-flow:row}
  .rung p{display:none} .rung{padding:10px} .rung b{font-size:15px}
  .shift{grid-template-columns:1fr}
}
